services:
  pihole:
    image: pihole/pihole:latest
    network_mode: host
    environment:
      TZ: ${TZ:-UTC}
      WEBPASSWORD: ${PIHOLE_PASSWORD}
      WEB_PORT: 8053
    volumes:
      - ./pihole/etc:/etc/pihole
      - ./pihole/dnsmasq:/etc/dnsmasq.d
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:10.11
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /mnt/media:/media:rw
    restart: unless-stopped

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    network_mode: host
    environment:
      WG_HOST: ${WG_HOST}
      PASSWORD_HASH: ${WG_PASSWORD_HASH}
      WG_DEFAULT_DNS: 10.8.0.1
      WG_ALLOWED_IPS: 0.0.0.0/0
      WG_PERSISTENT_KEEPALIVE: 25
      WG_POST_UP: >-
        iptables-nft -t nat -A POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE;
        iptables-nft -A INPUT -p udp -m udp --dport 51820 -j ACCEPT;
        iptables-nft -A FORWARD -i wg0 -j ACCEPT;
        iptables-nft -A FORWARD -o wg0 -j ACCEPT
      WG_POST_DOWN: >-
        iptables-nft -t nat -D POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE;
        iptables-nft -D INPUT -p udp -m udp --dport 51820 -j ACCEPT;
        iptables-nft -D FORWARD -i wg0 -j ACCEPT;
        iptables-nft -D FORWARD -o wg0 -j ACCEPT
    volumes:
      - ./wg-easy:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
