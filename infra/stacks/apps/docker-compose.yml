services:
  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    command: serve
    volumes:
      - /mnt/media/apps/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: info
      LOG_JSON: "false"
      DIUN_WATCH_WORKERS: "5"
      DIUN_WATCH_SCHEDULE: "0 8 * * *"
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
      DIUN_PROVIDERS_DOCKER_WATCHSTOPPED: "false"
      DIUN_NOTIF_TELEGRAM_TOKEN: ${DIUN_NOTIF_TELEGRAM_TOKEN}
      DIUN_NOTIF_TELEGRAM_CHATIDS: ${DIUN_NOTIF_TELEGRAM_CHATIDS}

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "127.0.0.1:8222:80"
    volumes:
      - /mnt/media/apps/vaultwarden:/data
    environment:
      TZ: ${TZ:-UTC}
      DOMAIN: https://vault.${BASE_DOMAIN}
      SIGNUPS_ALLOWED: "false"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:5055:5055"
    volumes:
      - /mnt/media/apps/seerr:/app/config
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: info
      PORT: "5055"

  paperless-redis:
    image: redis:7-alpine
    container_name: paperless-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - paperless-redis
      - tika
      - gotenberg
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - /mnt/media/apps/paperless/data:/usr/src/paperless/data
      - /mnt/media/apps/paperless/media:/usr/src/paperless/media
      - /mnt/media/apps/paperless/export:/usr/src/paperless/export
      - /mnt/media/apps/paperless/consume:/usr/src/paperless/consume
    environment:
      TZ: ${TZ:-UTC}
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_URL: https://docs.${BASE_DOMAIN}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_TIME_ZONE: ${TZ:-UTC}
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      USERMAP_UID: "1000"
      USERMAP_GID: "1000"

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.37
    container_name: gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=^file:///tmp/.*"

  tika:
    image: docker.io/apache/tika:3.3.1.0
    container_name: tika
    restart: unless-stopped

  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich_server
    restart: unless-stopped
    depends_on:
      - redis
      - database
    ports:
      - "127.0.0.1:2283:2283"
    volumes:
      - /mnt/media/apps/immich/library:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: ${TZ:-UTC}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
    healthcheck:
      disable: false

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich_machine_learning
    restart: unless-stopped
    volumes:
      - /mnt/media/apps/immich/model-cache:/cache
    environment:
      TZ: ${TZ:-UTC}
    healthcheck:
      disable: false

  redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    container_name: immich_redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    restart: unless-stopped
    shm_size: 128mb
    volumes:
      - /mnt/media/apps/immich/postgres:/var/lib/postgresql/data
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    healthcheck:
      disable: false
